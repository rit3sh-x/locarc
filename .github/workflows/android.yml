name: android

# The build itself is `bun run build:android` (scripts/build-android.ts), so it runs the same way
# locally; this workflow only installs the toolchain. Every Android change is checked (ktlint, the
# :core JVM tests) and built as a debug APK, uploaded as the `app-debug` artifact. On main, a
# signed release APK is then published to Convex as a release candidate; promotion happens in
# Settings → Releases.
on:
  pull_request:
    paths: &paths
      - android/**
      - convex/lib/wire/**
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      release:
        description: Also sign and publish a release candidate (main only)
        type: boolean
        default: false

# Superseded PR runs are cancelled; runs on main always finish.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # :core asks for a JDK 17 toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun run build:android

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-reports
          path: |
            android/core/build/reports/tests
            android/*/build/reports/ktlint
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    # Never cancel a release that has started.
    concurrency:
      group: android-release
      cancel-in-progress: false
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun run build:android release
        env:
          LOCARC_KEYSTORE_BASE64: ${{ secrets.LOCARC_KEYSTORE_BASE64 }}
          LOCARC_KEYSTORE_PASSWORD: ${{ secrets.LOCARC_KEYSTORE_PASSWORD }}
          LOCARC_KEY_ALIAS: ${{ secrets.LOCARC_KEY_ALIAS }}
          LOCARC_KEY_PASSWORD: ${{ secrets.LOCARC_KEY_PASSWORD }}
          CONVEX_URL: ${{ vars.CONVEX_URL }}

      - run: bun install --frozen-lockfile

      # Publish the APK and its build metadata as a release candidate.
      - run: >-
          bun run publish:release --
          --apk android/app/build/outputs/apk/release/app-release.apk
          --version-code "$VERSION_CODE" --version-name "$VERSION_NAME"
          --commit "$GITHUB_SHA"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
