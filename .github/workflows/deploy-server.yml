name: Deploy Server to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync server/ to HF Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_USERNAME }}/${{ vars.HF_SPACE_NAME }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
          subdirectory: server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Space secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_USERNAME }}/${{ vars.HF_SPACE_NAME }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
        run: |
          pip install --quiet "huggingface_hub>=0.26"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          for key in ("WEBHOOK_SECRET", "CONVEX_SITE_URL"):
              val = os.environ.get(key, "")
              if val:
                  print(f"Set {key}")
                  api.add_space_secret(repo_id=repo_id, key=key, value=val)
              else:
                  print(f"Skip {key} (empty)")
          PY

      - name: Summary
        run: |
          SPACE="${{ vars.HF_USERNAME }}/${{ vars.HF_SPACE_NAME }}"
          SUB=$(echo "$SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "### 🚀 Server Deployed to HF Spaces" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Space:** \`$SPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "**UI:** https://huggingface.co/spaces/$SPACE" >> $GITHUB_STEP_SUMMARY
          echo "**Direct:** https://$SUB.hf.space" >> $GITHUB_STEP_SUMMARY
